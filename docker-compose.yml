version: "3.8"

services:
  # 1. The Storage Engine (Local S3)
  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"            # S3 API Port
      - "4510-4559:4510-4559"  # Other AWS Services
    environment:
      # Pulls the token securely from your .env file
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      # Gives LocalStack access to the Docker engine (required for some pro features)
      - "/var/run/docker.sock:/var/run/docker.sock"

  # 2. The Metadata Engine (Database)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432" # Standard PostgreSQL Port
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      # Maps the database data to a persistent Docker volume
      - pgdata:/var/lib/postgresql/data

# 3. Persistent Storage Definition
volumes:
  pgdata:
